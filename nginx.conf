# The Developer Platform console's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. That makes a "page not found" screen a success: search engines index
# it, uptime checks call it healthy, link checkers pass, and a deploy that drops a route looks
# exactly like a deploy that did not.
#
# On this surface the address that matters is `/projects/<uuid>/keys` — the page a developer
# bookmarks and reloads while an integration is failing. A mistyped one answering 200 with an empty
# key list would look exactly like a project whose credentials had all been revoked, which is the
# single worst wrong conclusion this product could invite.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and `ROUTES` in src/lib/routes.ts must agree. That is one line per
# route, paid once per route, and `test/routes.test.ts` reads this file and fails the build when
# they drift. "Remember to update nginx.conf" is not a mechanism; a test is.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it — a
# conf.d file is included in http, so this is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui/surfaces, and test/sitemap.test.ts reads that
# export and fails if this alternation has drifted from it. They are the words that name an
# environment rather than a surface: `surfaces.ts` reserves them so no surface may take one as a
# subdomain, and `deploy/scripts/check-apex-prefix.py` enforces that.
#
# WHY IT MATTERS PARTICULARLY HERE. A testnet estate carries a testnet devplatform with its own
# database, its own projects and its own keys. Its `/apps` directory is a directory of test
# listings that look exactly like real ones, and its front page describes a scope vocabulary that
# governs credentials issued against nothing. Indexed beside the real console, the first result for
# "CloudsForge API key" could be the environment where a developer's key is thrown away nightly. So
# a non-mainnet environment answers `Disallow: /` and serves no sitemap at all.
#
# `(?:[^.]+-)?` catches BOTH shapes. The environment is a suffix on the first label now
# (`developers-testnet.<apex>`) and was an apex prefix before (`testnet.<apex>`, which put this
# surface at the two-label `developers.testnet.<apex>` — unreachable, because Cloudflare's
# Universal SSL is a one-label wildcard and every two-label name fails the handshake at the edge).
# `surfaces.ts` keeps the old shape deliberately, so both have to match or half the estate stays
# indexable on testnet.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # DENY rather than SAMEORIGIN, and this surface is the reason the difference matters. Every
    # screen behind the session gate creates or revokes a credential, and there is no legitimate
    # embed of a credential console anywhere — not even inside Hub. The public product surfaces use
    # SAMEORIGIN because they have real same-origin embeds; the operator console uses DENY for
    # exactly the argument that applies here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        # REPEATED, NOT INHERITED. nginx's `add_header` is all-or-nothing per level: a location
        # that declares ANY add_header inherits NONE from its parent. So every location below that
        # sets Cache-Control must restate the security headers, or it silently serves without them
        # — which is exactly what `location /assets/` did in the template, stripping nosniff from
        # every hashed script in every frontend cut from it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts. test/routes.test.ts reads both.
    location = / {
        try_files /index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /index.html here does
        # NOT re-enter `location = /index.html` above — and this location therefore has to declare
        # the shell's no-store itself. Without it `/` shipped with no Cache-Control at all, which
        # is the one document that must never be cached: it names the hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # The segments that are addresses in their own right: /organisations and /apps are pages, and
    # so is everything beneath them.
    location ~ ^/(organisations|apps)(/|$) {
        try_files /index.html =404;
        # Same reason as `location = /` above: try_files does not re-enter, so restate them all.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ── /projects IS A PREFIX AND NOT A PAGE, AND THE TRAILING SLASH IS THE WHOLE POINT ──────
    #
    # There is no screen at `/projects`: without a project id there is nothing to render, and this
    # app deliberately offers no "pick one" page — it is arrived at from an organisation. If the
    # alternation above included `projects`, `/projects` would be served the shell with a **200**
    # and React would render "there is nothing at this address" underneath it. That is exactly the
    # lie the rest of this file exists to refuse, reached from the inside instead of from a typo.
    #
    # So this location requires the slash. `/projects` falls through to `location /`, finds no
    # file, 404s, and `error_page` renders the app shell under that honest status.
    # `test/routes.test.ts` reads both blocks and checks them against `bare` in src/lib/routes.ts.
    location ~ ^/projects/ {
        try_files /index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the sitemap and robots.txt, emitted with $host -------------------
    # THEY ARE HERE RATHER THAN IN public/ FOR THE ONE REASON THAT DECIDES IT: a sitemap must carry
    # ABSOLUTE URLs — the spec requires it and a crawler discards a relative `<loc>` — and nothing
    # built in this repository is allowed to name a hostname, because one image is served from
    # localhost, from a preview deployment and from the apex (test/no-build-time-config.test.ts).
    # nginx is the component that knows: it has `$host` on every request, so the addresses are
    # composed per request and the artefact stays environment-free.
    #
    # A file in `public/` would be worse than either: an exact-match location wins over the
    # `location /` prefix that serves the static tree, so the file would be built, deployed,
    # unreachable, and edited by the next reader to no effect. test/sitemap.test.ts asserts neither
    # file exists there.
    #
    # ── WHY THIS IS NOT `sitemapXml()` FROM @cloudsforge/ui ──────────────────────────────────
    #
    # THIS SURFACE IS NOT THE APEX. The shared generator composes every sibling as
    # `<subdomain>.$host`, which is exactly right on the marketing site, where `$host` IS the apex.
    # Here `$host` is already `developers.<apex>`, so the same generator would emit
    # `hub.developers.<apex>` — a two-label hostname that resolves to nothing and fails the edge's
    # one-label wildcard certificate. A sitemap of addresses that cannot be connected to is worse
    # than no sitemap: a crawler handed dead URLs by a site's own index discounts the ones that
    # work. So this surface lists ITS OWN public routes and nothing else, and the estate sitemap
    # stays the apex's job.
    #
    # ── WHY ONLY TWO OF THE FOUR ROUTES ARE IN IT ────────────────────────────────────────────
    #
    # The sitemap lists exactly the routes `src/lib/routes.ts` marks `public`, which is exactly the
    # set devplatform serves without a credential: `/` (`GET /v1/scopes`,
    # `devplatform/src/server.ts:744`) and `/apps` (`GET /v1/apps`, `:1297`). `/organisations` and
    # `/projects/<id>` are somebody's private configuration behind a session gate — a crawler
    # reaching one is redirected to sign in, so listing them would be inviting a crawl of sign-in
    # bounces, and `metaFor()` answers `noindex, nofollow` there for the same reason. An invitation
    # here and an instruction there must not disagree; test/sitemap.test.ts checks that they do not.
    #
    # /apps/<slug> IS DELIBERATELY ABSENT. It is unbounded — one address per listed application,
    # minted by the service after review — and a static list of them here would be a second opinion
    # about which applications exist that goes stale the moment one is approved. They are reachable
    # from `/apps`, which IS the list of them, and that is what a crawler follows.
    location = /sitemap.xml {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.xml` in the URI to `text/xml` from its own table and the
        # `default_type` line is inert — a declaration that reads as a decision and is not one.
        types { }
        default_type application/xml;
        # Repeated, not inherited — the rule this file already records at `location /assets/`.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
        # An environment that must not be indexed has no sitemap. `return` inside `if` is one of the
        # two uses of `if` in a location that are defined behaviour rather than a trap.
        if ($cf_env) { return 404; }
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>$scheme://$host</loc></url>
  <url><loc>$scheme://$host/apps</loc></url>
</urlset>';
    }

    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
        # Every environment but mainnet refuses every crawler, whole.
        if ($cf_env) { return 200 'User-agent: *\nDisallow: /\n'; }
        # Generated by `robotsTxt()` in @cloudsforge/ui/sitemap and compared to it byte for byte by
        # test/sitemap.test.ts, trailing newline included: robots.txt is line-oriented and a parser
        # that reads the last line only when it is terminated silently loses the Sitemap directive.
        return 200 'User-agent: *
Allow: /

Sitemap: $scheme://$host/sitemap.xml
';
    }

    # ---- everything else -------------------------------------------------
    # A real file (favicon, the og card) is served; anything else 404s, and the error page below
    # turns that 404 into the app shell WITHOUT changing the status. robots.txt and sitemap.xml are
    # NOT among those files any more — the two exact-match locations above answer them.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the product works. That is Beacon's job.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
