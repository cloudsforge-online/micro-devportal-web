# Continuous integration.
#
# ────────────────────────────────────────────────────────────────────────────────────────────────
# THE `check` AND `image` JOBS BELOW ARE TEMPORARY, exactly as they are in `micro-trade-web`,
# `micro-worlds-web`, `micro-admin-web` and `micro-mint-web`. The org's reusable `web-ci.yml` is the
# target and the `hygiene` job already calls the org repository; the two local jobs exist for one
# reason and disappear with it:
#
#   @cloudsforge/ui is unpublished, and this repository consumes it as `link:../ui/packages/ui`.
#   The reusable workflow does a single checkout and then `pnpm install --frozen-lockfile`, which
#   cannot resolve a sibling directory that is not there. The day the design system is published
#   and the specifier in package.json becomes `^1.0.0`, everything from `check:` to the end of
#   `image:` is deleted and replaced by:
#
#     jobs:
#       ci:
#         uses: cloudsforge-online/micro-org/.github/workflows/web-ci.yml@main
#         with:
#           app: devportal-web
#           deep-link-path: /projects/5c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f/keys
#         permissions:
#           contents: read
#           packages: read
#
#   — the calling convention in `org/templates/web/_github/workflows/ci.yml`. The measured target in
#   docs/ecosystem/03-repository-responsibilities.md §5 is zero repositories with a bespoke CI file,
#   so treat every line from `check:` down as a liability with a deletion date rather than as
#   something to extend.
#
# TWO INPUTS OF THE REUSABLE WORKFLOW WILL STILL NOT SUIT THIS REPOSITORY:
#
#   * its `image` job probes a deep route and requires a 200 for ANY address. This app's nginx.conf
#     enumerates its real routes and answers 404 for everything else ON PURPOSE, so `build-image:
#     false` will be passed and the image is checked here, where the probe can assert the honest
#     answer as well as the deep link.
#   * it checks out no SIBLING SERVICE, so `test/devplatform.test.ts` would skip its
#     cross-repository half and the route citations would never be verified. That is the check this
#     repository exists to have; it stays local until the reusable workflow grows the input.
#
# `deep-link-path` is `/projects/<uuid>/keys` — a REAL address, two segments under a wildcard
# declared in `src/lib/routes.ts` and exported as `DEEP_LINK_PATH`, which `test/routes.test.ts`
# checks this file against. A probe against a path the app does not own proves only that the 404
# page renders.
#
# ── BOTH REASONS ABOVE ARE NOW OUT OF DATE, AND THE CONCLUSION STILL HOLDS ───────────────────────
#
# Re-checked against micro-org rather than believed:
#
#   * the single checkout is fixed. web-ci.yml checks the app out into `app/`, micro-ui into
#     `ui/` beside it, and installs THE SIBLING FIRST, because `link:` resolves to the sibling's own
#     node_modules — the shape of the `check:` job below. micro-ui is public now, so even the
#     `estate_token` fallback to `github.token` resolves.
#   * the deep-route probe is fixed, and inverted. web-ci.yml REQUIRES an unknown path to
#     answer 404 and names `try_files $uri /index.html` as the thing not to do; the 200 is now asked
#     only of the optional `deep-link-path` input, a route the app really has.
#
# So the two things that made a bespoke `check:` and `image:` unavoidable are gone. This file is
# still not deleted, because what remains is not a workaround: `rules:` (line 471 below) was
# never claimed to be temporary — re-read the first line of this header, it names `check` and
# `image` — and web-ci.yml has no input that could carry it. Its `runtime-hosts` job checks VITE_*,
# build arguments, third-party analytics and the README. It cannot check
#   that every route this client calls cites the line that serves it (line 532),
#   that an Idempotency-Key goes to five routes and no others (line 553),
#   or that nothing implies a secret can be recovered (line 566).
#
# Migrating would delete assertions to save a checkout that is already written. What was genuinely
# missing was a PRODUCER — nothing here ever pushed the image it built — and that is what the
# `publish` job at the end of this file adds.
# ────────────────────────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, 'design-system/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: devportal-web }

      # Temporary, for the same reason as the Dockerfile's second build context: the design system
      # is unpublished and resolves through `link:../ui/packages/ui`. It is also what
      # `test/tokens.test.ts` reads to prove every custom property this app names exists.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-ui
          path: ui
          # micro-ui is private; without a contents:read token this checkout 404s and the job dies
          # before install. Same wiring as the service repos' runtime checkout.
          token: ${{ secrets.ESTATE_READ_TOKEN }}

      # ══════════════════════════════════════════════════════════════════════════════════════════
      # THE SERVICE THIS CLIENT IS BUILT AGAINST, CHECKED OUT SO THE CITATIONS CAN BE VERIFIED.
      #
      # `test/devplatform.test.ts` reads `devplatform/src/server.ts` and requires that every route
      # this bundle calls is registered at the line its citation names, that each authenticates by
      # the MECHANISM the table records — not by a boolean, because no handler on this service
      # contains a literal `authenticate(ctx, deps)` and a boolean check would call all thirty-five
      # routes public — and that the client sends an `Idempotency-Key` to exactly the five wrapped
      # routes. Eight clients in this estate were built against a surface somebody imagined.
      #
      # Only `src/` is fetched — the citations are line numbers in source, and nothing here builds
      # or runs the service.
      # ══════════════════════════════════════════════════════════════════════════════════════════
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-devplatform
          path: devplatform
          token: ${{ secrets.ESTATE_READ_TOKEN }}
          sparse-checkout: |
            src

      # The brand assets, so test/brand-chrome.test.ts can compare the bytes in public/ against the
      # source set rather than merely checking that a file with the right name exists — and so the
      # "no social banner" assertion is checked against micro-brand rather than against memory.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-brand
          path: brand
          token: ${{ secrets.ESTATE_READ_TOKEN }}
          sparse-checkout: |
            assets/developers
            plan.ts
            README.md

      # `/auth/me` nests the profile under `user`. This repository states that as a fact and the
      # shape by reading micro-identity's own source rather than trusting a description of it.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-identity
          path: identity
          token: ${{ secrets.ESTATE_READ_TOKEN }}
          sparse-checkout: |
            src

      # The gateway, because three of this repository's known gaps are claims about it: that no
      # router forwards devplatform, that the CORS allowlist names `devportal.` rather than
      # `developers.`, and that the README says the service does not exist. All three are checked
      # against the gateway's own configuration by test/devplatform.test.ts.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-deploy
          path: deploy
          token: ${{ secrets.ESTATE_READ_TOKEN }}

      # The public SDK, for the same reason: "openapi.json carries no devplatform path" is a claim
      # with two citations in it.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-sdk
          path: sdk
          token: ${{ secrets.ESTATE_READ_TOKEN }}

      # The template this repository follows on the `/auth/me` shape and on the Dockerfile's
      # `COPY public ./public`. Cited, so checked.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-web-template
          path: web-template
          token: ${{ secrets.ESTATE_READ_TOKEN }}
          sparse-checkout: |
            src
            Dockerfile

      # The last four repositories this bundle cites into. They are here for one reason: the first
      # green run printed "UNCHECKED: citations into market, org, hub-api, service-template", which
      # is the citation sweep being honest about what it did NOT measure — and an unmeasured
      # citation left unmeasured on purpose is the shape of claim this repository exists to refuse.
      # Each is a single file's worth of sparse checkout.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-market
          path: market
          token: ${{ secrets.ESTATE_READ_TOKEN }}
          sparse-checkout: |
            src
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-org
          path: org
          token: ${{ secrets.ESTATE_READ_TOKEN }}
          sparse-checkout: |
            tools
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-hub-api
          path: hub-api
          token: ${{ secrets.ESTATE_READ_TOKEN }}
          sparse-checkout: |
            src
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-service-template
          path: service-template
          token: ${{ secrets.ESTATE_READ_TOKEN }}
          sparse-checkout: |
            src
      # The browser telemetry sink. `src/lib/obs.ts` cites its record shape by line — `fromWire`,
      # `RUM_KINDS`, the `kind` CHECK and the line that reads `samples` — because that contract is
      # the reason every browser event this bundle sent was silently discarded for months, and a
      # contract quoted from memory is exactly how it went wrong. The step below treats an
      # UNCHECKED citation as fatal, so citing lantern without checking it out is not an option.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-lantern
          path: lantern
          token: ${{ secrets.ESTATE_READ_TOKEN }}
          sparse-checkout: |
            src

      # Pinned, because the checkout lives at devportal-web/ and the action looks for the
      # packageManager field in the workspace root, where there is no package.json.
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: devportal-web/pnpm-lock.yaml }

      # `link:` resolves to the sibling's own node_modules, so the design system must be installed
      # before this repository is — without this, `tsc` cannot resolve ../ui's own imports (react,
      # react/jsx-runtime) when it typechecks the linked sources.
      - name: Install the sibling design system
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install
        working-directory: devportal-web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: devportal-web
        run: pnpm typecheck

      - name: Test
        working-directory: devportal-web
        run: pnpm test

      # ── The route cross-check must have RUN, not merely not failed ────────────────────────────
      #
      # `test/devplatform.test.ts` skips its cross-repository half when there is no
      # micro-devplatform checkout, so that `pnpm test` passes for somebody who cloned only this
      # repository. A skipped test is an unmeasured one, so on the runner the absence has to be
      # fatal — otherwise a checkout that silently produced nothing would look exactly like a client
      # whose citations are all correct.
      - name: The citations were checked against the real service
        working-directory: devportal-web
        run: |
          set -euo pipefail
          test -f ../devplatform/src/server.ts || {
            echo "::error::micro-devplatform was not checked out; the route citations were never verified"
            exit 1
          }
          # ── THERE IS NO LINE NUMBER TO READ ANY MORE, AND THAT IS THE POINT ────────────────────
          #
          # This used to pull the cited line for POST /v1/projects/:id/keys out of the test and grep
          # the output for it. The line number was itself the defect: it named a position in a file
          # micro-devplatform owns, so a commit inserting 32 lines above its route table turned this
          # repository red twice in one week while not one route had changed its method, path,
          # authority or idempotency. The suite now finds each route by searching for its `define(`,
          # which is the fact worth having and the one that survives the service being edited.
          out=$(node --import tsx --test test/devplatform.test.ts 2>&1 || true)
          if grep -q 'SKIPPED: no micro-devplatform checkout' <<<"$out"; then
            echo "::error::the route cross-check skipped itself while micro-devplatform was present"
            exit 1
          fi
          grep -q "is registered in devplatform/src/server.ts" <<<"$out" || {
            echo "::error::the route cross-check did not run against devplatform/src/server.ts"
            exit 1
          }
          # Thirty called routes plus five declined ones, each looked up in the service.
          #
          # DEDUPED before counting. node:test names each subtest twice — once as it runs and once
          # in the summary — so a raw `grep -c` reports double. The threshold would still pass, so
          # nothing would be broken; the LOG LINE would simply be wrong, which is the defect this
          # whole repository is built to avoid. A number nobody can reconcile is a number somebody
          # eventually reasons from.
          count=$(printf '%s\n' "$out" | grep -oE '[A-Z]+ /v1/[^ ]+ is registered in devplatform/src/server\.ts' | sort -u | wc -l | tr -d ' ')
          [ "$count" -ge 35 ] || {
            echo "::error::only $count routes were checked against the service; the surface has thirty-five"
            exit 1
          }
          # And the MECHANISM half really ran too. A suite that verified every citation and skipped
          # every authentication check would pass the line above while leaving the one property this
          # service makes hard — that no handler calls `authenticate` directly — entirely unmeasured.
          #
          # The mechanism names are matched with a character class that has to include every one the
          # table can hold. `operator-or-lower` and `user+member` arrived with
          # micro-devplatform@e13c154, and a class without a hyphen in it would have matched
          # `operator` and stopped — counting the route whose authority is a DIRECTION as if it were
          # a plain operator route, which is the one this repository cared most about.
          auth=$(printf '%s\n' "$out" | grep -oE 'authenticates by [a-z+:-]+' | wc -l | tr -d ' ')
          [ "$auth" -ge 35 ] || {
            echo "::error::only $auth routes had their authentication mechanism checked"
            exit 1
          }
          echo "ok: $count routes verified against the service that serves them, mechanisms included"

      # …and the cross-check can fail. Bend one citation and require the suite to go red, so a
      # `devplatform.test.ts` reduced to assertions that always pass cannot look like a verified
      # client.
      - name: …and it would have noticed a route the service does not serve
        working-directory: devportal-web
        run: |
          set -euo pipefail
          cp test/devplatform.test.ts "$RUNNER_TEMP/devplatform.test.ts.orig"
          restore() { cp "$RUNNER_TEMP/devplatform.test.ts.orig" test/devplatform.test.ts; }
          trap restore EXIT

          # THE MUTATION IS A PATH NOW, NOT A LINE. Bending a line number tested that the suite read
          # a particular POSITION in the service; bending a path tests that it read the service at
          # all, which is the property actually worth having and the only one that survives
          # micro-devplatform being edited. POST /v1/projects/:id/keys is a route the service really
          # registers, so renaming it to one it does not must turn this suite red.
          #
          # The mutation is asserted to have HAPPENED before its effect is judged: a `sed` that
          # matched nothing is a silent no-op, and this step would then report a correct test as
          # fake — a confident wrong diagnosis, which is the defect this repository exists to avoid.
          grep -q "path: '/v1/projects/:id/keys'" test/devplatform.test.ts || {
            echo "::error::POST /v1/projects/:id/keys is not in the surface table; it has changed shape"
            exit 1
          }
          sed -i "s|path: '/v1/projects/:id/keys'|path: '/v1/projects/:id/keys-that-do-not-exist'|" test/devplatform.test.ts
          if cmp -s test/devplatform.test.ts "$RUNNER_TEMP/devplatform.test.ts.orig"; then
            echo "::error::the mutation changed nothing, so this step proves nothing"
            exit 1
          fi

          if node --import tsx --test test/devplatform.test.ts >/dev/null 2>&1; then
            echo "::error::the cross-check passed with a route micro-devplatform does not serve — it is not reading the service"
            exit 1
          fi
          echo "ok: naming a route the service does not serve turns the suite red, so a pass is evidence"

      # …and the MECHANISM half can fail too, which is a different claim from the citation half.
      # The route table records HOW each route authenticates because a boolean grep for
      # `authenticate(ctx, deps)` finds nothing in any handler on this service and would therefore
      # call every route public. Prove the mechanism check can go red by claiming the key-issuance
      # route is public.
      - name: …and it would have noticed a wrong authentication mechanism
        working-directory: devportal-web
        run: |
          set -euo pipefail
          cp test/devplatform.test.ts "$RUNNER_TEMP/devplatform.test.ts.orig2"
          restore() { cp "$RUNNER_TEMP/devplatform.test.ts.orig2" test/devplatform.test.ts; }
          trap restore EXIT

          before=$(grep -c "auth: 'none'" test/devplatform.test.ts)
          sed -i "s|path: '/v1/projects/:id/keys', auth: 'project:write'|path: '/v1/projects/:id/keys', auth: 'none'|" test/devplatform.test.ts
          after=$(grep -c "auth: 'none'" test/devplatform.test.ts)
          [ "$after" -gt "$before" ] || {
            echo "::error::the mutation changed nothing, so this step proves nothing"
            exit 1
          }

          if node --import tsx --test test/devplatform.test.ts >/dev/null 2>&1; then
            echo "::error::the cross-check accepted POST /v1/projects/:id/keys as PUBLIC — it is not reading the handler"
            exit 1
          fi
          echo "ok: calling the key-issuance route public turns the suite red"

      # ── The design-system cross-check must also have RUN ──────────────────────────────────────
      #
      # `test/tokens.test.ts` proves every `--cf-*` this stylesheet reads is declared by micro-ui.
      # micro-mint-web ships ten that are not, across 72 declarations, and nothing in that
      # repository fails — an undefined custom property invalidates the declaration silently.
      - name: The design tokens were checked against the design system
        working-directory: devportal-web
        run: |
          set -euo pipefail
          test -f ../ui/packages/ui/src/tokens.css || {
            echo "::error::micro-ui was not checked out; the token references were never verified"
            exit 1
          }
          out=$(node --import tsx --test test/tokens.test.ts 2>&1 || true)
          if grep -q 'SKIPPED: no micro-ui checkout' <<<"$out"; then
            echo "::error::the token cross-check skipped itself while micro-ui was present"
            exit 1
          fi
          grep -q 'every property this stylesheet reads is declared' <<<"$out" || {
            echo "::error::the token cross-check did not run against tokens.css"
            exit 1
          }
          echo "ok: every custom property this stylesheet names exists upstream"

      - name: …and it would have noticed an invented token
        working-directory: devportal-web
        run: |
          set -euo pipefail
          cp src/styles.css "$RUNNER_TEMP/styles.css.orig"
          printf '\n.dp-canary { border: 1px solid var(--cf-border); }\n' >> src/styles.css
          if node --import tsx --test test/tokens.test.ts >/dev/null 2>&1; then
            echo "::error::the token cross-check accepted --cf-border, which does not exist"
            cp "$RUNNER_TEMP/styles.css.orig" src/styles.css
            exit 1
          fi
          cp "$RUNNER_TEMP/styles.css.orig" src/styles.css
          echo "ok: an undefined custom property turns the suite red"


      - name: Build
        working-directory: devportal-web
        run: pnpm build

      # A frontend that builds to nothing is a blank page, not a build failure. The previous estate
      # served SPAs from the API process and shipped an image with no dist in it.
      - name: The bundle exists
        working-directory: devportal-web
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html is missing after a successful build"; exit 1; }
          echo "ok: $(find dist -type f | wc -l | tr -d ' ') files in dist"

      # The brand chrome must survive the BUILD as well as be present in the source tree.
      # test/brand-chrome.test.ts asserts the source; this asserts the artefact, because Vite copies
      # publicDir at build time and a misconfigured publicDir would pass the first and fail the
      # second.
      - name: The brand chrome reached the bundle
        working-directory: devportal-web
        run: |
          set -euo pipefail
          for asset in favicon-32x32.png favicon-192x192.png favicon-512x512.png og-1200x630.png; do
            test -f "dist/$asset" || { echo "::error::dist/$asset is missing from the build output"; exit 1; }
          done
          echo "ok: the favicons and the og card are in dist"

  rules:
    name: Estate rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No build-time configuration
        # The same rule as test/no-build-time-config.test.ts, checked again here so it fails even if
        # somebody deletes the test along with the line it forbids. A `VITE_` variable is read at
        # build time and frozen into the artefact, and an artefact with an environment frozen into
        # it has to be rebuilt to be promoted — which means the thing that reaches production is not
        # the thing that passed CI.
        run: |
          set -uo pipefail
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.html' \
               -e 'import\.meta\.env' -e 'VITE_' src index.html; then
            echo "::error::this bundle must read no build-time environment; hosts come from cloudsforgeHosts() at runtime"
            exit 1
          fi
          echo "ok: no build-time environment"

      - name: No hard-coded CloudsForge hostname
        # A literal hostname is a second, unversioned copy of the surface registry, and the copy is
        # the one that will be wrong. Comments are stripped first: src/lib/hosts.ts explains the
        # gateway's CORS defect by naming the two hostnames involved, and a grep over the raw file
        # would fail the file that is most careful about them.
        run: |
          set -uo pipefail
          strip() { perl -0pe 's{/\*.*?\*/}{}gs; s{^\s*//.*$}{}gm' "$1"; }
          for f in $(find src -name '*.ts' -o -name '*.tsx'); do
            if strip "$f" | grep -n 'cloudsforge\.online' | sed "s|^|$f:|" | grep .; then
              echo "::error::resolve hosts through cloudsforgeHosts() rather than naming them"
              exit 1
            fi
          done
          echo "ok: no literal hostnames in src"

      - name: The SPA fallback keeps its 404
        # Comments are stripped first. nginx.conf's own header QUOTES the directive it forbids, in
        # order to explain why the routes are enumerated by hand, so a grep over the raw file
        # matches the warning and would fail a correct config.
        run: |
          set -uo pipefail
          directives=$(grep -v '^[[:space:]]*#' nginx.conf)
          if printf '%s\n' "$directives" | grep -nE 'try_files[[:space:]]+\$uri[[:space:]]+(\$uri/[[:space:]]+)?/index\.html'; then
            echo "::error::unknown paths must 404; serve the shell through error_page 404 /index.html"
            exit 1
          fi
          grep -q 'error_page 404 /index.html' <<<"$directives"
          echo "ok: unknown paths answer 404"

      - name: The auth callback is redeemed before the app renders
        # The hand-off code has to leave the address bar before the exchange goes over the wire, and
        # that only happens if bootstrapSession() runs before React mounts.
        run: grep -q 'bootstrapSession' src/main.tsx

      - name: The route table, the navigation and nginx agree
        # Already asserted by test/routes.test.ts; repeated here so deleting the test does not
        # silently delete the rule.
        run: test -f test/routes.test.ts && grep -q 'nginx.conf' test/routes.test.ts

      - name: Every route this client calls cites the line that serves it
        # The rule test/devplatform.test.ts enforces, restated so that deleting the test does not
        # delete it. Every `/v1/...` path in the client must live in the one file that also carries
        # the `devplatform/src/server.ts:<line>` citations.
        run: |
          set -uo pipefail
          # ROWS IN THE CLIENT'S OWN TABLES, not citations carrying a line number.
          #
          # This counted `devplatform/src/server.ts:<line>` and required thirty-five of them, which
          # made a line number a CI requirement — the exact practice that turned this repository red
          # twice in a week for edits made in micro-devplatform. What the count was standing in for
          # is that every route the console calls or declines is written down somewhere a reader can
          # find the REASON, and that is a table row. The exact per-route check is
          # test/devplatform.test.ts's; this is the half that survives the test file being deleted.
          rows=$(grep -coE '^ \* \| `[A-Z]+` +\| `/v1/' src/lib/devplatform.ts || true)
          if [ "${rows:-0}" -lt 35 ]; then
            echo "::error::src/lib/devplatform.ts documents ${rows:-0} routes in its tables; the surface has thirty-five"
            exit 1
          fi
          grep -q 'devplatform/src/server.ts' src/lib/devplatform.ts || {
            echo "::error::src/lib/devplatform.ts no longer says which service source its surface was read from"
            exit 1
          }
          cites=$rows
          if grep -rn --include='*.tsx' -E "api<[^>]*>\(\s*[\`'\"]/v1/" src; then
            echo "::error::a page calls /v1 directly; every call goes through src/lib/devplatform.ts, where it is cited"
            exit 1
          fi
          echo "ok: ${cites} citations, and no uncited call site"

      - name: An Idempotency-Key goes to five routes and no others
        # devplatform wraps five routes and reads no such header on the other eleven mutations.
        # micro-trade requires it everywhere and micro-mint nowhere, so a client copied from either
        # breaks here in one direction or the other. Counted rather than described.
        run: |
          set -uo pipefail
          sent=$(grep -coE 'headers: idempotently\(' src/lib/devplatform.ts || true)
          if [ "${sent:-0}" -ne 5 ]; then
            echo "::error::src/lib/devplatform.ts sends ${sent:-0} idempotency keys; five routes require one"
            exit 1
          fi
          echo "ok: five wrapped routes, five keys"

      - name: Nothing implies a secret can be recovered
        # THE RULE THIS PRODUCT IS BUILT AROUND. There is no column an API key or an OAuth client
        # secret could be read back from, so "we can send it to you again" is not a copy mistake —
        # it is an instruction to do something that will fail, from the only party the reader has to
        # trust on the question. Also asserted by test/render.test.ts; repeated so deleting the test
        # does not delete the rule.
        #
        # COMMENTS ARE STRIPPED FIRST, for the fourth time in this file and for the same reason each
        # time: this repository's own comments quote every forbidden phrase in order to explain why
        # it is forbidden, so a grep over the raw text fails the files that are most careful. A rule
        # that can only be satisfied by deleting the explanation is a rule that gets deleted.
        run: |
          set -uo pipefail
          strip() { perl -0pe 's{/\*.*?\*/}{}gs; s{^\s*//.*$}{}gm' "$1"; }
          fail=0
          for f in $(find src -name '*.ts' -o -name '*.tsx'); do
            if strip "$f" | grep -niE '\breveal\b|\bview (your |the )?(api )?key\b|\bcontact support\b|\bretrieve (it|the secret|your key)\b|\bwe (have )?emailed\b' \
                 | sed "s|^|$f:|" | grep .; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::nothing in this app may imply a secret can be recovered; it cannot"
            exit 1
          fi
          echo "ok: no phrasing implies recovery"

      - name: A secret is never persisted
        # It lives in one component's props and in the caller's state, and is cleared on
        # acknowledgement. src/lib/api.ts holds the SESSION tokens and is one exemption.
        #
        # src/lib/obs.ts is the other, and it is NOT exempted on trust: it is the estate's shared
        # browser reporter, byte-identical in seventeen frontends, and it touches sessionStorage
        # for one thing — a per-tab random id that lets two samples from one session be joined. It
        # is not a devplatform secret, is not derived from one, and dies with the tab. What that
        # file may do with storage is pinned by `test/render.test.ts` ("the one exempted file
        # stores only the RUM session id, under one key"), which runs in the Test step above and
        # fails on a localStorage, a document.cookie, or any second key. This exemption is
        # therefore narrower than it looks, and the check that narrows it is not this one.
        #
        # COMMENTS STRIPPED FIRST — and this step is why the rule is worth restating rather than
        # assuming. Its first version did not strip them, and it failed the build on
        # src/components/once.tsx, whose own comment says "Nothing here touches `localStorage`".
        # That is the sixth time in this estate a guard has gone red against the sentence
        # explaining it. The fix is to strip the prose, never to delete the explanation.
        run: |
          set -uo pipefail
          strip() { perl -0pe 's{/\*.*?\*/}{}gs; s{^\s*//.*$}{}gm' "$1"; }
          fail=0
          for f in $(find src -name '*.ts' -o -name '*.tsx'); do
            [ "$f" = "src/lib/api.ts" ] && continue
            [ "$f" = "src/lib/obs.ts" ] && continue
            if strip "$f" | grep -nE 'localStorage|sessionStorage|document\.cookie' | sed "s|^|$f:|" | grep .; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::a secret must not reach browser storage"
            exit 1
          fi
          echo "ok: no storage outside the session token store"

      - name: No act-as-anyone parameter
        # A developer acts as themselves. devplatform derives the acting principal from the token
        # and reads a project's organisation from the ROW rather than from the request
        # (devplatform/src/server.ts), so there is no parameter to expose — and a control
        # shaped like one in a customer console is how an operator primitive ends up in a product.
        run: |
          set -uo pipefail
          if grep -rnE "(onBehalfOf|actAs|impersonat)" --include='*.ts' --include='*.tsx' src; then
            echo "::error::a developer acts as themselves; this app has no act-as primitive"
            exit 1
          fi
          echo "ok: no act-as-anyone primitive"

      - name: A quota may be lowered here and never raised
        # ──────────────────────────────────────────────────────────────────────────────────────
        # THE ROUTE CHANGED UNDER THIS RULE; THE RULE DID NOT.
        #
        # This step used to forbid any quota-setting vocabulary outright, because
        # PUT /v1/projects/:id/quotas was plain project:write with no ceiling — the party the
        # limit binds chose the limit. micro-devplatform@e13c154 made the DIRECTION the authority:
        # lowering is project:write, raising and creating are an operator's, and a browser can
        # never be an operator because devplatform:admin is absent from scopes.ts.
        #
        # So the lowering control is allowed and the raise vocabulary is still forbidden. Two
        # things are asserted rather than one, because "no raise" alone is satisfied by a file
        # that lost the control entirely, and a rule that passes when the feature is deleted is a
        # rule that eventually deletes it.
        # ──────────────────────────────────────────────────────────────────────────────────────
        run: |
          set -uo pipefail
          strip() { perl -0pe 's{/\*.*?\*/}{}gs; s{^\s*//.*$}{}gm' "$1"; }
          for f in $(find src -name '*.ts' -o -name '*.tsx'); do
            if strip "$f" | grep -nE 'setQuota|putQuota|raiseLimit|raiseQuota' | sed "s|^|$f:|" | grep .; then
              echo "::error::this console lowers a quota and never raises one"
              exit 1
            fi
          done
          # The direction check is in the client, before the request is built. Without it the page
          # would post a raise and read a 403, which teaches a developer the control is broken
          # rather than that the rule exists.
          # `grep -q … < <(strip …)` rather than `strip … | grep -q …`: grep -q exits on its first
          # match by design, and under `pipefail` the producer's EPIPE (141) became the pipeline's
          # status. That failed in the DANGEROUS direction — the `||` below fired and declared the
          # refusal missing while it was present at src/lib/devplatform.ts. Measured here: the
          # piped form said MISSING on 10 of 20 runs; this form is correct on 20 of 20. Process
          # substitution keeps grep's own exit status, so the rule still means exactly what it did.
          grep -q 'quota_raise_refused' < <(strip src/lib/devplatform.ts) || {
            echo "::error::src/lib/devplatform.ts no longer refuses a quota raise before the wire"
            exit 1
          }
          grep -q 'lowerQuota(' < <(strip src/pages/usage.tsx) || {
            echo "::error::the usage screen no longer offers the lowering control"
            exit 1
          }
          echo "ok: lowering only, refused in the client and again by the service"

      - name: A path id is never sent malformed
        # A malformed :id reaches a uuid column on every route that predates requireUuid and comes
        # back as 500 internal rather than 400 — devplatform/src/server.ts says so, and
        # declines to change the shipped status codes in one commit. It deliberately writes down NO
        # count: this comment used to say "eleven", micro-devplatform@aadf5a6 deleted that number
        # because three readers had counted eleven, nineteen and twenty-five, and the source and
        # README were corrected while this copy was not. The command is the honest form of it:
        #
        #     grep -oE "'/v1/[^']*:id[^']*'" devplatform/src/server.ts | sort -u | wc -l   # 19 at aadf5a6
        #
        # This console's addresses ARE those ids, so a typo must not read as an outage. Asserted
        # here as well as in the suite, because deleting the test would otherwise delete the rule.
        run: |
          set -uo pipefail
          strip() { perl -0pe 's{/\*.*?\*/}{}gs; s{^\s*//.*$}{}gm' "$1"; }
          guarded=$(strip src/lib/devplatform.ts | grep -c 'assertUuid(' || true)
          # One definition plus one call per id-taking wrapper. Below twenty means a wrapper was
          # added without the guard, which is the way this comes back.
          if [ "${guarded:-0}" -lt 20 ]; then
            echo "::error::only ${guarded:-0} uses of assertUuid in src/lib/devplatform.ts; every wrapper taking an id needs one"
            exit 1
          fi
          # And no page interpolates a raw id into a path of its own — that would go round the
          # guard entirely. The broader form of this rule is the /v1 check above.
          if strip src/pages/*.tsx | grep -nE '/v1/[a-z-]+/\$\{'; then
            echo "::error::a page builds a path with an unguarded id"
            exit 1
          fi
          echo "ok: ${guarded} guarded id uses, and no page builds its own path"

      - name: Every design token this stylesheet names is a real one
        # test/tokens.test.ts proves it against the sibling checkout. This is the half that runs
        # without one: the property names micro-mint-web invented are refused by name. Comments
        # are stripped first, for the same reason the nginx step strips them: the stylesheet's own
        # header quotes the property names it forbids in order to explain why.
        #
        # `--cf-critical` was on this list and has been taken off it: tokens.css now declares it
        # (three times, one per theme) and test/tokens.test.ts — which resolves against the real
        # file rather than a copy of it kept here — passes. A blacklist written from a snapshot
        # goes stale the moment the snapshot does, and this one had begun failing a stylesheet
        # for naming a token that exists.
        run: |
          set -uo pipefail
          css=$(perl -0pe 's{/\*.*?\*/}{}gs' src/styles.css)
          if printf '%s\n' "$css" | grep -nE 'var\(--cf-(border|radius-md|space-[1-5][^a-z0-9-]|status-(good|warn|crit)|warning|font[^-])'; then
            echo "::error::that custom property does not exist in tokens.css; see the header of src/styles.css"
            exit 1
          fi
          if printf '%s\n' "$css" | grep -nE 'var\(--cf-[a-z0-9-]+[[:space:]]*,'; then
            echo "::error::a var() fallback is a hard-coded value wearing a token's clothes"
            exit 1
          fi
          if printf '%s\n' "$css" | grep -nE '#[0-9a-fA-F]{3,8}\b|\brgba?\(|\bhsla?\('; then
            echo "::error::no literal colours; every colour comes from a token"
            exit 1
          fi
          echo "ok: real tokens only, no fallbacks, no literals"

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: devportal-web }
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-ui
          path: ui
          token: ${{ secrets.ESTATE_READ_TOKEN }}

      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: devportal-web
          build-contexts: uipkg=ui
          build-args: RELEASE=${{ github.sha }}
          push: false
          load: true
          tags: devportal-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PROBED, NOT READ. Both defects this step guards were invisible in the config and obvious in
      # a response: nginx's `add_header` is all-or-nothing per level, so a location that sets
      # Cache-Control silently loses every inherited security header; and `try_files` is a file
      # lookup rather than an internal redirect, so serving /index.html from `location = /` never
      # enters `location = /index.html`. Reading the file suggests both are fine. Curling it does
      # not.
      - name: The image serves the app, 404s what it does not own, and sends the headers it promises
        run: |
          set -uo pipefail
          docker run -d --name ci-devportal-web -p 127.0.0.1:8080:8080 devportal-web:ci
          for _ in $(seq 1 30); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "${code:-}" = "200" ] || { echo "::error::the image returned ${code:-no answer} for /"; docker logs --tail 60 ci-devportal-web; exit 1; }

          fail=0

          # A route this app OWNS must survive a hard refresh. The path is DEEP_LINK_PATH in
          # src/lib/routes.ts, and test/routes.test.ts checks this file against it. It is two
          # segments under the wildcard, which is the shape a developer actually bookmarks.
          deep=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/projects/5c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f/keys || true)
          [ "$deep" = "200" ] || { echo "::error::an owned route returned $deep — it must be served the shell"; fail=1; }

          # The organisation page, which is the other address somebody links a colleague to.
          org=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/organisations/5c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f || true)
          [ "$org" = "200" ] || { echo "::error::an organisation page returned $org"; fail=1; }

          # A route it does NOT own must answer 404 while still serving the shell, so the reader
          # gets a real page and the status line tells the truth. This is the assertion the org's
          # reusable image job cannot make, because it requires a 200 for any deep link.
          unknown=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope/not/a/route || true)
          [ "$unknown" = "404" ] || { echo "::error::an unknown address returned $unknown; it must be 404"; fail=1; }
          curl -s -m 5 http://127.0.0.1:8080/nope/not/a/route | grep -q '<div id="root">' \
            || { echo "::error::the 404 did not serve the app shell"; fail=1; }

          check() { # url, header, expected-substring, label
            got=$(curl -sI "$1" | tr -d '\r' | grep -i "^$2:" | cut -d' ' -f2- || true)
            case "${got:-}" in
              "") echo "::error::$4 is missing $2"; fail=1 ;;
              *"$3"*) echo "  ok   $4: $2: $got" ;;
              *) echo "::error::$4 has the wrong $2 (got '${got:-nothing}', wanted '$3')"; fail=1 ;;
            esac
          }

          asset=$(curl -s http://127.0.0.1:8080/ | grep -oE '/assets/[^"]+\.js' | head -1)
          for target in "http://127.0.0.1:8080/" "http://127.0.0.1:8080/organisations" "http://127.0.0.1:8080$asset"; do
            [ -n "$asset" ] || [ "$target" != "http://127.0.0.1:8080" ] || continue
            check "$target" X-Content-Type-Options "nosniff" "$target"
            # DENY, not SAMEORIGIN: every gated screen here creates or revokes a credential and
            # nothing anywhere has a reason to frame that. The public product surfaces differ, and
            # for a stated reason.
            check "$target" X-Frame-Options "DENY" "$target"
            check "$target" Referrer-Policy "strict-origin" "$target"
          done
          check "http://127.0.0.1:8080/" Cache-Control "no-store" "the shell"
          check "http://127.0.0.1:8080/organisations" Cache-Control "no-store" "an enumerated route"
          [ -n "$asset" ] && check "http://127.0.0.1:8080$asset" Cache-Control "immutable" "a hashed asset"

          # This surface must NOT be kept out of an index: the scope vocabulary and the application
          # directory are public pages this product wants read.
          robots=$(curl -sI http://127.0.0.1:8080/ | tr -d '\r' | grep -ci '^X-Robots-Tag:' || true)
          [ "${robots:-0}" = "0" ] || { echo "::error::this public surface sends X-Robots-Tag"; fail=1; }

          # The brand chrome is SERVED by the image, not merely committed to the repository. The web
          # template's Dockerfile once did not copy public/ into the build context, so four
          # frontends shipped an image with no icon in it while their own brand test passed. Fixed
          # upstream at web-template/Dockerfile:39; this probe is what would have caught it.
          for asset in favicon-32x32.png favicon-192x192.png og-1200x630.png; do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/$asset" || true)
            [ "$code" = "200" ] || { echo "::error::/$asset returned $code from the image"; fail=1; }
          done

          docker rm -f ci-devportal-web >/dev/null 2>&1 || true
          exit $fail
      - name: Down
        if: always()
        run: docker rm -f ci-devportal-web || true

  hygiene:
    # The org's reusable secret check. Cheap, and it catches the failure that cannot be undone: a
    # secret pushed to a repository is compromised the moment it lands, and rotating it is the only
    # remedy. On this repository the point is sharper than usual — a `cfk_live_…` string committed
    # here would be a live customer credential in a git history.
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read

  # ────────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. Until this job existed the `image:` job above built this image and threw
  # it away, so the release path could not name it. Every line number below was read off the source,
  # not off the prose that cites it — the numbers in micro-org's own publish-image.yml header have
  # already drifted:
  #
  #   generator  `cfctl release` pins one image per deployable, the name from
  #              org/tools/registry.ts (`ghcr.io/<org>/<repo.repo>`, which is why the package
  #              is micro-<app> and not <app>) and the tag from that repository's package.json
  #              version, org/tools/cfctl.ts.
  #   verifier   `cfctl release --verify` runs `docker manifest inspect` on EVERY entry and returns
  #              non-zero if one cannot be pulled, org/tools/cfctl.ts.
  #   deployer   deploy/scripts/release-deploy.sh refuses to change anything while any image
  #              is missing.
  #
  # A frontend with no producer was therefore a manifest entry that could never verify.
  #
  # `packages: write` IS GRANTED HERE and not asked for inside the shared workflow, which is forced
  # rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or reduced, never
  # elevated, so a reusable workflow asking for a permission its caller withheld fails the run at
  # STARTUP, before a step runs. Measured on micro-org: run 30900277471 (caller capped at
  # `packages: read`) ended in startup_failure; run 30900280323 (same workflow, caller granting
  # `packages: write`) succeeded. That is also why `push: false` stays in the `image:` job above —
  # that job is a GATE and needs `load:` so it can boot the container and probe it. This is the
  # producer. Different purposes, so different jobs.
  #
  # `needs:` names EVERY other job, so nothing is published that did not pass every gate here.
  # ────────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [check, rules, image, hygiene]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/design-system/') ||
      startsWith(github.ref, 'refs/heads/release/'))
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      # `web`, so the producer checks micro-ui out as the `uipkg` named build context this
      # repository's Dockerfile reads at line 24. It names ONLY the contexts its kind checked
      # out, because buildx stats every named context before it opens the Dockerfile.
      kind: web
    secrets:
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
